<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pré-venda · Quarteto Coração de Potro</title>
<meta name="description" content="Pré-venda das camisetas do Quarteto Coração de Potro. Escolha a estampa e o tamanho.">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #ffffff;
    --soft: #f5f1ea;
    --card: #ffffff;
    --ink: #1f1b16;
    --muted: #6b645a;
    --line: #ddd6ca;
    --accent: #f4a340;
    --accent-ink: #1f1b16;
    --accent-text: #8f5208;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
    padding-bottom: 150px;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px; }

  header { padding: 24px 0 8px; text-align: center; }
  header img.logo { display: block; width: 200px; max-width: 60%; height: auto; margin: 0 auto 4px; }
  header .tag {
    font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
  }
  header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400; font-size: 30px; line-height: 1.15; margin: 10px 0 14px;
  }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .specs {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px;
    margin-top: 16px; font-size: 13px; color: var(--ink);
  }
  .specs span + span::before { content: "·"; margin-right: 14px; color: var(--muted); }

  .preco { margin-top: 18px !important; font-size: 15px; color: var(--ink) !important; }
  .preco s { color: var(--muted); margin-right: 6px; }
  .preco b { font-size: 20px; font-weight: 600; }
  .preco small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--accent-text); }
  .how { margin: 22px 0 6px; font-size: 13px; color: var(--muted); text-align: center; }

  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; margin-top: 16px;
  }
  .mock {
    position: relative; aspect-ratio: 4 / 5; border-radius: 10px; overflow: hidden;
    background: repeating-linear-gradient(45deg, transparent 0 10px, rgba(127,127,127,.06) 10px 20px);
    border: 1px dashed var(--line);
    display: grid; place-items: center;
  }
  .mock img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .mock .ph { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .item h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400; font-size: 21px; margin: 14px 2px 10px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  }
  .item h2 small { font-family: system-ui, sans-serif; font-size: 12px; color: var(--muted); }

  .sizes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .size {
    appearance: none; font: inherit; font-size: 14px; color: var(--ink);
    background: transparent; border: 1px solid var(--line); border-radius: 10px;
    min-height: 44px; cursor: pointer; position: relative;
  }
  .size[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .size .n {
    position: absolute; top: -7px; right: -5px; min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 10px; background: var(--accent); color: var(--accent-ink);
    font-size: 12px; line-height: 20px; font-weight: 600;
  }

  .lines { margin-top: 10px; display: grid; gap: 6px; }
  .line {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; padding: 6px 4px 6px 12px; border-radius: 10px; background: var(--soft);
  }
  .step { display: flex; align-items: center; gap: 4px; }
  .step button {
    appearance: none; font: inherit; font-size: 18px; width: 40px; height: 40px;
    border: 0; border-radius: 10px; background: transparent; color: var(--ink); cursor: pointer;
  }
  .step output { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }

  .info { margin: 26px 2px 0; font-size: 12.5px; color: var(--muted); }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--card); border-top: 1px solid var(--line);
    padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
  }
  .bar .wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .bar input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink);
    background: var(--soft); border: 1px solid var(--line); border-radius: 10px;
    padding: 0 12px; min-height: 46px;
  }
  .bar input:focus-visible, .size:focus-visible, .step button:focus-visible, .send:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .total { font-size: 13px; color: var(--muted); white-space: nowrap; text-align: right; }
  .total b { color: var(--ink); font-weight: 600; }
  .send {
    appearance: none; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px;
    min-height: 50px; width: 100%;
  }
  .send:disabled { opacity: .45; cursor: not-allowed; }
  .msg { font-size: 12.5px; color: var(--accent-text); min-height: 1em; margin: 0; text-align: center; }
</style>
</head>
<body>

<header class="wrap">
  <img class="logo" src="logo.png" alt="Quarteto Coração de Potro" width="500" height="500">
  <h1>Pré-venda de camisetas</h1>
  <p>Escolha a estampa e o tamanho. Seu pedido segue direto para o nosso WhatsApp.</p>
  <div class="specs"><span>Camiseta branca</span><span>100% algodão</span><span>PP ao G3</span></div>
  <p class="preco" id="preco"></p>
</header>

<main class="wrap">
  <p class="how">Toque no tamanho para adicionar. Pode escolher mais de uma estampa.</p>
  <div id="lista"></div>
  <p class="info" id="info"></p>
</main>

<div class="bar">
  <div class="wrap">
    <div class="row">
      <input id="nome" type="text" autocomplete="name" placeholder="Seu nome" aria-label="Seu nome">
      <div class="total" id="total" aria-live="polite">0 peças</div>
    </div>
    <p class="msg" id="msg" role="status"></p>
    <button class="send" id="enviar" type="button" disabled>Enviar pedido pelo WhatsApp</button>
  </div>
</div>

<script>
/* ===== AJUSTES (edite só aqui) ===== */
const WHATSAPP = "5549999854920";   // (49) 99985-4920
const PRECO_NORMAL = 110;        // preço por peça depois da promoção
const PRECO_PROMO = 100;         // preço promocional por peça
const PROMO_ATE = "2026-11-06";  // último dia da promoção (inclusive); depois volta ao preço normal
const INFO = "Prazo, retirada e pagamento combinados pelo WhatsApp.";

const TAMANHOS = ["PP", "P", "M", "G", "GG", "G1", "G2", "G3"];
// Para cada modelo, salve o mockup em mockups/<arquivo> (JPG, 4:5 de preferência).
const MODELOS = [
  { nome: "Sem ti",                arquivo: "sem-ti.jpg" },
  { nome: "Tirador",               arquivo: "tirador.jpg" },
  { nome: "Folcloreando",          arquivo: "folcloreando.jpg" },
  { nome: "Crioulo",               arquivo: "crioulo.jpg" },
  { nome: "Tirana do lenço florido", arquivo: "tirana-do-lenco-florido.jpg" },
  { nome: "Na outra lua",          arquivo: "na-outra-lua.jpg" },
  { nome: "Tô de volta chamarrita", arquivo: "to-de-volta-chamarrita.jpg" },
  { nome: "Pala rubro",            arquivo: "pala-rubro.jpg" },
];
/* =================================== */

// Data de hoje em Brasília (AAAA-MM-DD), para a promoção virar sozinha à meia-noite.
const hoje = new Date().toLocaleDateString("sv-SE", { timeZone: "America/Sao_Paulo" });
const emPromo = hoje <= PROMO_ATE;
const PRECO = emPromo ? PRECO_PROMO : PRECO_NORMAL;
const brl = v => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const pedido = MODELOS.map(() => ({})); // [{ "M": 2, "G": 1 }, ...]

const $ = id => document.getElementById(id);
const lista = $("lista");

function el(tag, attrs = {}, ...filhos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  filhos.forEach(f => e.append(f));
  return e;
}

function mudar(i, t, delta) {
  const novo = (pedido[i][t] || 0) + delta;
  if (novo <= 0) delete pedido[i][t]; else pedido[i][t] = Math.min(novo, 99);
  desenhar(i);
  resumo();
}

function desenhar(i) {
  const card = lista.children[i];
  const sel = pedido[i];
  const qtdModelo = Object.values(sel).reduce((a, b) => a + b, 0);

  card.querySelector("h2 small").textContent = qtdModelo ? `${qtdModelo} ${qtdModelo > 1 ? "peças" : "peça"}` : "";

  card.querySelectorAll(".size").forEach(b => {
    const t = b.dataset.t, q = sel[t] || 0;
    b.setAttribute("aria-pressed", q ? "true" : "false");
    const n = b.querySelector(".n");
    if (q) { if (n) n.textContent = q; else b.append(el("span", { class: "n" }, String(q))); }
    else if (n) n.remove();
  });

  const linhas = card.querySelector(".lines");
  linhas.replaceChildren(...TAMANHOS.filter(t => sel[t]).map(t =>
    el("div", { class: "line" },
      el("span", {}, `Tamanho ${t}`),
      el("div", { class: "step" },
        el("button", { type: "button", "aria-label": `Menos um ${t}`, onclick: () => mudar(i, t, -1) }, "−"),
        el("output", {}, String(sel[t])),
        el("button", { type: "button", "aria-label": `Mais um ${t}`, onclick: () => mudar(i, t, 1) }, "+")
      )
    )
  ));
}

MODELOS.forEach((m, i) => {
  const img = el("img", { src: `mockups/${m.arquivo}`, alt: `Camiseta ${m.nome}`, loading: "lazy" });
  img.addEventListener("error", () => img.remove());
  const mock = el("div", { class: "mock" }, el("span", { class: "ph" }, "Mockup em breve"), img);

  const tams = el("div", { class: "sizes", role: "group", "aria-label": `Tamanhos da camiseta ${m.nome}` },
    ...TAMANHOS.map(t => el("button", {
      class: "size", type: "button", "data-t": t, "aria-pressed": "false",
      "aria-label": `Adicionar tamanho ${t}`, onclick: () => mudar(i, t, 1)
    }, t))
  );

  lista.append(el("section", { class: "item" },
    mock,
    el("h2", {}, el("span", {}, m.nome), el("small", {})),
    tams,
    el("div", { class: "lines" })
  ));
});

$("preco").innerHTML = emPromo
  ? `<s>${brl(PRECO_NORMAL)}</s><b>${brl(PRECO_PROMO)}</b> por peça<small>Preço de pré-venda até ${PROMO_ATE.slice(8)}/${PROMO_ATE.slice(5, 7)}</small>`
  : `<b>${brl(PRECO_NORMAL)}</b> por peça`;

if (INFO) $("info").textContent = INFO;

function totalPecas() {
  return pedido.reduce((s, sel) => s + Object.values(sel).reduce((a, b) => a + b, 0), 0);
}

function resumo() {
  const n = totalPecas();
  let txt = `<b>${n}</b> ${n === 1 ? "peça" : "peças"}`;
  if (n) txt += ` · <b>${brl(n * PRECO)}</b>`;
  $("total").innerHTML = txt;
  $("enviar").disabled = n === 0;
  $("msg").textContent = "";
}

function mensagem() {
  const linhas = [];
  MODELOS.forEach((m, i) => {
    const partes = TAMANHOS.filter(t => pedido[i][t]).map(t => `${t} x${pedido[i][t]}`);
    if (partes.length) linhas.push(`• ${m.nome}: ${partes.join(", ")}`);
  });
  const n = totalPecas();
  let txt = `Olá! Quero fazer meu pedido da pré-venda do Quarteto Coração de Potro.\n\nNome: ${$("nome").value.trim()}\n\nPedido:\n${linhas.join("\n")}\n\nTotal: ${n} ${n === 1 ? "peça" : "peças"}`;
  txt += ` (${brl(n * PRECO)})`;
  return txt;
}

$("enviar").addEventListener("click", () => {
  const msg = $("msg");
  if (!$("nome").value.trim()) { msg.textContent = "Escreva seu nome para continuar."; $("nome").focus(); return; }
  if (!WHATSAPP) { msg.textContent = "WhatsApp ainda não configurado."; return; }
  window.location.href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(mensagem())}`;
});

resumo();
</script>
</body>
</html>
